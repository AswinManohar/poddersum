[project]
name = "poddersum-mcp"
version = "0.1.0"
description = "MCP server for PodderSum: search podcasts and get cited, timestamped episode summaries."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
]

[project.scripts]
poddersum-mcp = "poddersum_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poddersum_mcp"]
